# separate terms of service, privacy policy, and support
# documentation.

name: Build and Publish Docker Image

on:
  push:
    branches: ['main', 'eks-deployment-updates']

env:
  REGISTRY: docker.io
  IMAGE_NAME: tasky
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: us-east-1

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Check if we should use ECR based on secrets
      - name: Check if AWS credentials are available
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "use_aws=true" >> $GITHUB_OUTPUT
          else
            echo "use_aws=false" >> $GITHUB_OUTPUT
          fi

      # Configure AWS credentials if using ECR
      - name: Configure AWS credentials
        if: steps.check-aws.outputs.use_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Set registry to ECR with hardcoded account ID
      - name: Set ECR registry
        if: steps.check-aws.outputs.use_aws == 'true'
        run: |
          echo "REGISTRY=034362065257.dkr.ecr.us-east-1.amazonaws.com" >> $GITHUB_ENV

      # ECR Login
      - name: Login to Amazon ECR
        if: steps.check-aws.outputs.use_aws == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # DockerHub Login - fallback to GitHub packages if no Docker Hub credentials
      - name: Login to DockerHub or GitHub Container Registry
        if: steps.check-aws.outputs.use_aws != 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
