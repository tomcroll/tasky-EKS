name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types:
      - completed
    branches: ['main']

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ github.repository }}
  EKS_CLUSTER: wiz-gitops-wiz-challenge-eks
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: docker.io

jobs:
  DeployToEKS:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      # Check if we should use ECR based on secrets
      - name: Check if AWS credentials are available
        id: check-aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "use_aws=true" >> $GITHUB_OUTPUT
          else
            echo "use_aws=false" >> $GITHUB_OUTPUT
          fi
          
      # Set registry to ECR if using AWS
      - name: Set ECR registry
        if: steps.check-aws.outputs.use_aws == 'true'
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          echo "REGISTRY=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> $GITHUB_ENV
      
      - name: Get Kubernetes config
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Create tasky namespace if not exists
        run: kubectl create namespace tasky --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image placeholders in manifests
        run: |
          sed -i "s|\${ECR_REPOSITORY}|${{ env.REGISTRY }}/${{ env.ECR_REPOSITORY }}|g" k8s/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
      
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/tasky -n tasky
      
      - name: Show resources
        run: |
          echo "Pods:"
          kubectl get pods -n tasky
          echo "Services:"
          kubectl get svc -n tasky
          echo "LoadBalancer URL:"
          kubectl get svc tasky -n tasky -o jsonpath="{.status.loadBalancer.ingress[0].hostname}"
